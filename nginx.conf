server {
    # PORT is set by PaaS hosts (Railway, Render...); the Dockerfile defaults it to 80.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API requests to the backend service.
    # ${BACKEND_URL} is substituted at container start by nginx's envsubst
    # (only env vars are replaced; nginx runtime vars like $host are left intact).
    location /api/ {
        client_max_body_size 5m;   # farmer photo uploads
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        # Send the backend's own host name (not the frontend's): hosts like Railway route by Host header,
        # and HTTPS backends need it for SNI.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
